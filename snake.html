<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #000;
            display: block;
            margin-bottom: 20px;
        }
        #info {
            color: #fff;
            font-size: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff;">Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="info">Score: <span id="score">0</span></div>
    <button onclick="location.reload()">Restart Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        // Game variables
        const gridSize = 20;
        const gridCount = canvas.width / gridSize;
        
        let snake = [{ x: 10, y: 10 }];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameRunning = true;

        // Event listeners for keyboard input
        document.addEventListener('keydown', handleKeyPress);

        function handleKeyPress(event) {
            switch(event.key) {
                case 'ArrowUp':
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                    event.preventDefault();
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                    event.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                    event.preventDefault();
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                    event.preventDefault();
                    break;
            }
        }

        function generateFood() {
            let newFood;
            let collision;
            do {
                collision = false;
                newFood = {
                    x: Math.floor(Math.random() * gridCount),
                    y: Math.floor(Math.random() * gridCount)
                };
                for (let segment of snake) {
                    if (segment.x === newFood.x && segment.y === newFood.y) {
                        collision = true;
                        break;
                    }
                }
            } while (collision);
            food = newFood;
        }

        function update() {
            if (!gameRunning) return;

            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            // Check wall collision
            if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
                endGame();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gridCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            ctx.fillStyle = '#00FF00';
            for (let i = 0; i < snake.length; i++) {
                ctx.fillRect(snake[i].x * gridSize + 1, snake[i].y * gridSize + 1, 
                            gridSize - 2, gridSize - 2);
            }

            // Draw head with different color
            ctx.fillStyle = '#00AA00';
            ctx.fillRect(snake[0].x * gridSize + 1, snake[0].y * gridSize + 1,
                        gridSize - 2, gridSize - 2);

            // Draw food
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1,
                        gridSize - 2, gridSize - 2);
        }

        function endGame() {
            gameRunning = false;
            alert(`Game Over! Final Score: ${score}\n\nPress OK to restart.`);
            location.reload();
        }

        function gameLoop() {
            update();
            draw();
        }

        // Start game loop
        setInterval(gameLoop, 100);

        // Initial food generation
        generateFood();
        draw();
    </script>
</body>
</html>
